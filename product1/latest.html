<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Son Eklenenler - MovieApp</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/user-details-modal.css">
    <link rel="stylesheet" href="css/user-panel.css">
</head>
<body>
    <div class="mobile-navbar">
        <button class="menu-toggle-btn" id="menuToggle">☰</button>
        <div class="mobile-logo">MovieAdmin</div>
        <div style="width: 24px;"></div>
    </div>

    <div class="sidebar">
        <div class="logo">MovieAdmin</div>
        <ul>
            <li><a href="search.html">İçerik Ara / Ekle</a></li>
            <li><a href="latest.html">Kütüphane</a></li>
            <li><a href="favorites.html">Favorilerim</a></li>
            <li><a href="watchlist.html">Daha Sonra İzle</a></li>
            <li><a href="showcase.html">Daily (AI)</a></li>
            <li><a href="#" onclick="logout()">Çıkış Yap</a></li>
        </ul>
    </div>

    <main class="main-content-area">
        <div class="section-header">
            <h2>🔥 Son Eklenen İçerikler</h2>
            <p>Platforma en son eklenen güncel film ve dizileri keşfedin.</p>
        </div>
        <div id="latestGrid" class="media-grid"></div>
    </main>

        <!-- Kullanıcı Detay Modalı -->
    <div id="contentDetailModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; overflow-y: auto;">
        <div style="background: #11141a; border: 1px solid #1e232d; border-radius: 12px; width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; color: #fff; padding: 20px; position: relative;">
            <button onclick="closeContentDetailModal()" style="position: absolute; top: 15px; right: 15px; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;">✕</button>
        
            <!-- Modal Kapak Resmi -->
            <img id="modalBanner" src="" alt="Kapak" style="width: 100%; height: 300px; object-fit: cover; border-radius: 8px; margin-bottom: 15px;">
        
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 id="modalTitle" style="margin: 0; font-size: 22px;"></h2>
                <span id="modalTypeBadge" style="background: #e50914; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;"></span>
            </div>
        
            <p id="modalOverview" style="color: #8a99ad; font-size: 14px; line-height: 1.5; margin-bottom: 20px;"></p>

            <!-- İzleme İlerlemesi -->
            <div style="margin-bottom: 20px; background: #151922; padding: 12px; border-radius: 8px;">
                <div id="modalProgressText" style="font-size: 13px; margin-bottom: 6px; color: #c5d1e0;"></div>
                <div style="background: #2a3447; height: 6px; border-radius: 3px; overflow: hidden;">
                    <div id="modalProgressBar" style="background: #e50914; width: 0%; height: 100%;"></div>
                </div>
            </div>

            <!-- Sekmelerin ve İçeriklerin Yükleneceği Alan -->
            <div id="modalTabBody"></div>
        </div>
    </div>
    
    <script src="js/auth-guard.js"></script>
    <script src="js/user-panel.js"></script>
    <script src="js/user-details-modal.js"></script>
</body>
</html>
