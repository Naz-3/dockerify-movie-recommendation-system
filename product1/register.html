<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieApi - Kayıt Ol</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div id="toast-container"></div>

    <div class="login-container">
        <h2>Kayıt Ol</h2>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="regUsername">Kullanıcı Adı</label>
                <input type="text" id="regUsername" class="form-input" placeholder="Kullanıcı adınız" required>
            </div>
            
            <div class="form-group">
                <label for="regEmail">E-posta</label>
                <input type="email" id="regEmail" class="form-input" placeholder="ornek@mail.com" required>
            </div>

            <div class="form-group">
                <label for="regPassword">Şifre</label>
                <input type="password" id="regPassword" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submitBtn" class="login-btn">
                <span class="spinner" id="btnSpinner"></span>
                <span id="btnText">Kayıt Ol</span>
            </button>
            
            <p class="register-link">Zaten hesabın var mı? <a href="login.html">Giriş Yap</a></p>
        </form>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
