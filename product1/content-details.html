<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İçerik Detayları</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/details.css">
    <link rel="stylesheet" href="css/message.css">
</head>
<body>

<div class="sidebar">
    <div class="logo">MovieAdmin</div>

    <ul>
        <li><a href="admin.html">🛡️ Admin Paneli</a></li>
        <li><a href="index.html">Dashboard</a></li>
        <li class="active"><a href="library.html">İçerik Yönetimi</a></li>
        <li><a href="movie-form.html">Yeni İçerik</a></li>
        <li><a href="actors.html">Oyuncular</a></li>
        <li><a href="showcase.html">Daily</a></li>
        <li><a href="statistics.html">İstatistikler</a></li>
    </ul>
    <ul style="margin-top: auto;">
        <li><a href="#" id="logoutBtn">Çıkış Yap</a></li>
    </ul>
</div>

<div class="main">

    <header>
        <h1>İçerik Detayları</h1>
    </header>

    <div class="details-wrapper">

        <div class="poster-panel">
            <img id="poster" src="https://placehold.co/300x450?text=Poster" alt="Poster">
        </div>

        <div class="details-panel">

            <div class="detail-group">
                <label>Başlık</label>
                <p id="detailTitle">-</p>
            </div>

            <div class="detail-row">
                <div class="detail-group">
                    <label>Yıl</label>
                    <p id="detailYear">-</p>
                </div>
                <div class="detail-group">
                    <label>IMDb Puanı</label>
                    <p id="detailImdb">-</p>
                </div>
            </div>

            <div class="detail-row">
                <div class="detail-group">
                    <label>Tür</label>
                    <p id="detailGenre">-</p>
                </div>
                <div class="detail-group">
                    <label>Süre</label>
                    <p id="detailDuration">-</p>
                </div>
            </div>

            <div class="detail-group">
                <label>Yönetmen</label>
                <p id="detailDirector">-</p>
            </div>

            <div class="detail-group">
                <label>Oyuncular</label>
                <p id="detailCast">-</p>
            </div>

            <div class="detail-row">
                <div class="detail-group">
                    <label>Ülke</label>
                    <p id="detailCountry">-</p>
                </div>
                <div class="detail-group">
                    <label>Dil</label>
                    <p id="detailLanguage">-</p>
                </div>
            </div>

            <div class="detail-group">
                <label>Ödüller</label>
                <p id="detailAwards">-</p>
            </div>

            <div class="detail-group">
                <label>Açıklama</label>
                <p id="detailDescription">-</p>
            </div>

            <section class="season-section">
                <h2>Sezonlar</h2>
                <div id="seasonList"></div>
            </section>
        </div>
    </div>
</div>

<!-- Bölüm Düzenleme Modalı -->
<div id="episodeModal" class="episode-modal hidden">
    <div class="episode-modal-content">
        <span class="close-modal" onclick="closeEpisodeModal()">&times;</span>
        <h2>Bölümü Düzenle</h2>
        <img id="modalPosterPreview" src="https://placehold.co/250x360?text=Poster" alt="Önizleme">

        <div class="modal-group">
            <label>Poster URL</label>
            <input type="text" id="modalPoster">
        </div>
        <div class="modal-group">
            <label>Özet</label>
            <textarea id="modalPlot" rows="8"></textarea>
        </div>
        <div class="modal-buttons">
            <button class="save-btn" onclick="saveEpisode()">Kaydet</button>
            <button class="sync-btn" onclick="syncEpisode()">OMDb ile Senkronize</button>
        </div>
    </div>
</div>

<!-- Sezon Videosu/Fragman İzleme Modalı -->
<div id="videoModal" class="episode-modal hidden">
    <div class="episode-modal-content video-modal-content">
        <span class="close-modal" onclick="closeVideoModal()">&times;</span>
        <h3 id="videoModalTitle" style="margin-bottom: 15px; color: #fff;">Fragman</h3>
        <div class="video-container">
            <iframe id="videoIframe" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>
</div>

<!-- Medya Ekle Modalı (Yönetici İçe Aktarma / Link Verme) -->
<div id="addMediaModal" class="episode-modal hidden">
    <div class="episode-modal-content">
        <span class="close-modal" onclick="closeAddMediaModal()">&times;</span>
        <h3 style="color: #fff; margin-bottom: 15px;">Yeni Medya Ekle</h3>
        
        <div class="modal-group">
            <label style="color: #a1c0ce;">Başlık</label>
            <input type="text" id="mediaTitleInput" placeholder="Örn: Official Trailer 2">
        </div>

        <div class="modal-group">
            <label style="color: #a1c0ce;">Medya Türü</label>
            <select id="mediaTypeSelect" class="modal-select">
                <option value="Trailer">Fragman</option>
                <option value="Teaser">Teaser</option>
                <option value="Behind the Scenes">Kamera Arkası</option>
                <option value="Clip">Klip</option>
            </select>
        </div>

        <div class="modal-group">
            <label style="color: #a1c0ce;">Ekleme Yöntemi</label>
            <div class="radio-options">
                <label><input type="radio" name="mediaSource" value="link" checked onclick="toggleMediaInputType('link')"> Link Ver (YouTube)</label>
                <label><input type="radio" name="mediaSource" value="file" onclick="toggleMediaInputType('file')"> Dosya İçe Aktar</label>
            </div>
        </div>

        <div class="modal-group" id="mediaLinkGroup">
            <label style="color: #a1c0ce;">YouTube Linki veya Video ID</label>
            <input type="text" id="mediaUrlInput" placeholder="https://www.youtube.com/watch?v=XXXXX">
        </div>

        <div class="modal-group hidden" id="mediaFileGroup">
            <label style="color: #a1c0ce;">Video Dosyası Seç</label>
            <input type="file" id="mediaFileInput" accept="video/*">
        </div>

        <div class="modal-buttons">
            <button class="save-btn" onclick="saveNewMedia()">Kaydet ve Ekle</button>
            <button class="cancelBtn" onclick="closeAddMediaModal()">İptal</button>
        </div>
    </div>
</div>

<script src="js/auth-guard.js"></script>
<script src="js/details.js"></script>
<script src="js/message.js"></script>

</body>
</html>
