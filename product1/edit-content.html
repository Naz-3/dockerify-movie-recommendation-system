<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İçerik Düzenle</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/edit.css">
    <link rel="stylesheet" href="css/message.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">MovieAdmin</div>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="library.html">İçerik Yönetimi</a></li>
            <li><a href="movie-form.html">Yeni İçerik</a></li>
            <li><a href="actors.html">Oyuncular</a></li>
            <li><a href="statistics.html">İstatistikler</a></li>
        </ul>
        <ul style="margin-top: auto;">
            <li><a href="#" id="logoutBtn">Çıkış Yap</a></li>
        </ul>
    </div>
    <div class="main">
        <header>
            <div>
                <h1>İçerik Düzenle</h1>
                <p class="subtitle">Veritabanındaki bilgileri güncelle.</p>
            </div>
        </header>
        <div class="edit-wrapper">
            <div class="poster-panel">
                <img id="posterPreview" src="https://placehold.co/300x450?text=Poster" alt="Poster Önizleme">
                <button class="updateBtn" onclick="refreshOmdb()">OMDb'den Güncelle</button>
            </div>
            <div class="edit-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="title">Başlık</label>
                        <input id="title">
                    </div>
                    <div class="form-group">
                        <label for="year">Yıl</label>
                        <input id="year">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="genre">Tür</label>
                        <input id="genre">
                    </div>
                    <div class="form-group">
                        <label for="type">İçerik Tipi</label>
                        <select id="type">
                            <option value="movie">Film</option>
                            <option value="series">Dizi</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="rating">IMDb Puanı</label>
                        <input id="rating">
                    </div>
                    <div class="form-group">
                        <label for="runtime">Süre</label>
                        <input id="runtime">
                    </div>
                </div>
                <div class="form-group">
                    <label for="director">Yönetmen</label>
                    <input id="director">
                </div>
                <div class="form-group">
                    <label for="writer">Yazar</label>
                    <input id="writer">
                </div>
                <div class="form-group">
                    <label for="producer">Yapımcı</label>
                    <input id="producer">
                </div>
                <div class="form-group">
                    <label for="actors">Başrol Oyuncuları</label>
                    <textarea id="actors"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="country">Ülke</label>
                        <input id="country">
                    </div>
                    <div class="form-group">
                        <label for="language">Dil</label>
                        <input id="language">
                    </div>
                </div>
                <div class="form-group">
                    <label for="awards">Ödüller</label>
                    <textarea id="awards" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label for="plot">Açıklama</label>
                    <textarea id="plot"></textarea>
                </div>
                <div class="form-group">
                    <label for="poster">Poster URL</label>
                    <input id="poster">
                </div>
                <button class="saveButton" onclick="saveMovie()">Kaydet</button>
            </div>
        </div>
    </div>
    <script src="js/auth-guard.js"></script>
    <script src="js/edit-content.js"></script>
    <script src="js/language.js"></script>
    <script src="js/message.js"></script>
</body>
</html>
