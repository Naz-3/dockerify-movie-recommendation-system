<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieApi - Giriş Yap</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div id="toast-container"></div>

    <div class="login-container">
        <h2>Giriş Yap</h2>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Kullanıcı Adı</label>
                <input type="text" id="username" required autocomplete="username" placeholder="Kullanıcı adınız">
            </div>
            
            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <button type="submit" id="submitBtn">
                <span class="spinner" id="btnSpinner"></span>
                <span id="btnText">Giriş Yap</span>
            </button>
        </form>
        
        <p>Hesabın yok mu? <a href="register.html">Kayıt Ol</a></p>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
