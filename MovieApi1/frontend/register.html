<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol</title>
    <!-- css klasörünün altındaki login.css dosyasını çağırıyoruz -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <h2>Kayıt Ol</h2>
        
        <div id="errorMessage" class="error-message" style="display: none;"></div>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="regUsername">Kullanıcı Adı</label>
                <input type="text" id="regUsername" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label for="regEmail">E-posta</label>
                <input type="email" id="regEmail" class="form-input" required>
            </div>

            <div class="form-group">
                <label for="regPassword">Şifre</label>
                <input type="password" id="regPassword" class="form-input" required>
            </div>

            <button type="submit" class="login-btn">Kayıt Ol</button>
            
            <p class="register-link">Zaten hesabın var mı? <a href="login.html">Giriş Yap</a></p>
        </form>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
