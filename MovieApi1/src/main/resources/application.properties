spring.application.name=movie-service

spring.datasource.url=${PRODUCTION_DB_URL}
spring.datasource.username=${PRODUCTION_DB_USER}
spring.datasource.password=${PRODUCTION_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

#toplu importlarda QL sorgularının toplu INSERT olarak veritabanına atilmasi
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

omdb.api.key=${OMDB_API_KEY}

tmdb.api.key=${TMDB_API_KEY}
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.image-base-url=https://image.tmdb.org/t/p/w500

openai.api.key=${OPENAI_API_KEY}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini

# HTTP port
server.port=8081
eureka.client.service-url.defaultZone=${EUREKA_URL:http://discovery-server:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=movie-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.naz.movieapi1.messaging.event
spring.kafka.consumer.properties.spring.json.type.mapping=showcaseGenerated:com.naz.movieapi1.messaging.event.ShowcaseGeneratedV1,showcaseFailed:com.naz.movieapi1.messaging.event.ShowcaseGenerationFailedV1
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=showcaseRequested:com.naz.movieapi1.messaging.event.ShowcaseGenerationRequestedV1

showcase.kafka.topics.generation-requested=showcase.generation.requested.v1
showcase.kafka.topics.generated=showcase.generated.v1
showcase.kafka.topics.generation-failed=showcase.generation.failed.v1
